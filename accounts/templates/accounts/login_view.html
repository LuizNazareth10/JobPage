{% comment %} {% extends "global/base.html" %} {% endcomment %}

{% block content %}
    <h1>Login</h1>
    <form method="post" action="{% url 'accounts:login_view' %}">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Login">
    </form>
    <p>Don't have an account? <a href="{% url 'accounts:signup_view' %}">Register here</a></p>
    <p>Forgot your password? <a href="{% url 'accounts:logout_view' %}">Reset it here</a></p>
    <p>Back to <a href="{% url 'accounts:login_view' %}">Recarregar</a></p>
{% endblock %}
